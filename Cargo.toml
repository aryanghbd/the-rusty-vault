[package]
name = "the-rusty-vault"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
